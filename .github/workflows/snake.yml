name: Serpente do mar

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpente.svg?color_snake=#c1121f&color_dots=#efe6dc,#f2b8b2,#e0736a,#c1121f,#7a1418
            dist/serpente-escura.svg?palette=github-dark&color_snake=#ff3b30&color_dots=#1a0d0d,#4a0d0f,#7a1418,#a4161a,#ff5a4f

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
